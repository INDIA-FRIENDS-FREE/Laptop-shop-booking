 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECOND HAND LAPTOP SHOP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- दुकान का नया नाम -->
        <h1 class="shop-title">🔥 SECOND HAND LAPTOP SHOP 🔥</h1>
        <p class="shop-subtitle">Premium Quality Laptops at Pocket-Friendly Prices</p>
        
        <!-- प्रीमियम लुक वाला सर्च और प्राइस फिल्टर बॉक्स -->
        <div class="filter-container">
            <input type="text" id="searchBar" placeholder="🔍 लैपटॉप का नाम या स्पेक्स ढूंढें...">
            <div class="price-inputs">
                <input type="number" id="minPrice" placeholder="📉 कम से कम ₹">
                <input type="number" id="maxPrice" placeholder="📈 ज्यादा से ज्यादा ₹">
            </div>
        </div>
    </header>

    <!-- यहाँ सारे लैपटॉप और नए एप्पल मैकबुक दिखाई देंगे -->
    <main id="laptopContainer" class="laptop-grid"></main>

    <!-- ऑर्डर करने के लिए पॉपअप फॉर्म (Modal) -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2>🛒 Confirm Your Order</h2>
            <p id="modalLaptopInfo"></p>
            
            <form id="bookingForm">
                <input type="text" id="custName" placeholder="Enter Your Full Name" required>
                <input type="tel" id="custPhone" placeholder="Enter WhatsApp Number" required>
                <textarea id="custAddress" placeholder="Enter Delivery Full Address" rows="4" required></textarea>
                <button type="submit" class="submit-booking">📲 Complete Booking via WhatsApp</button>
                <button type="button" class="close-btn" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
